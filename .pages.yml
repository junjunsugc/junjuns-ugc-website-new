
media:
  input: assets
  output: /assets

content:
  - name: website
    label: Website Settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: hero_label
        label: Homepage Greeting
        type: string
      - name: hero_description
        label: Homepage Introduction
        type: text
      - name: portrait
        label: Homepage Portrait
        type: image
      - name: email
        label: Contact Email
        type: string
      - name: instagram
        label: Instagram Link
        type: string

  - name: projects
    label: Portfolio Projects
    type: collection
    path: content/projects
    format: json
    filename: '{primary}.json'
    view:
      fields: [title, category, featured, published]
      primary: title
      sort: [title]
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: category
        label: Portfolio Category
        type: select
        required: true
        options:
          values:
            - name: Beauty & Skincare
              value: beauty
            - name: Cosplay & Creative
              value: cosplay
            - name: Fashion & Styling
              value: fashion
            - name: Travel, Lifestyle & Food
              value: lifestyle
      - name: description
        label: Description
        type: text
      - name: cover
        label: Cover Photo
        type: image
      - name: video
        label: Video File or URL
        type: string
        description: Paste a direct HTTPS MP4 URL or an uploaded file path.
      - name: status
        label: Project Label
        type: string
      - name: featured
        label: Featured on All Work
        type: boolean
        default: false
      - name: published
        label: Show on Website
        type: boolean
